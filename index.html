<style>
:root{--bg:#fbf6ef;--card:#fff;--tx:#2b1d14;--mu:#7a6454;--ac:#b4562a;--bd:#e8dccd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1210;--card:#271b17;--tx:#f5e9dc;--mu:#b9a290;--ac:#e8895a;--bd:#3d2c25}}
:root[data-theme="dark"]{--bg:#1a1210;--card:#271b17;--tx:#f5e9dc;--mu:#b9a290;--ac:#e8895a;--bd:#3d2c25}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,"Noto Serif Armenian",serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:20px;margin:28px 0 10px}
.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:12px}
.date{color:var(--mu);font-size:14px}
.film{font-size:26px;margin:6px 0;color:var(--ac)}
.nav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
button,.chip{font:inherit;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:999px;padding:7px 14px;cursor:pointer}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.rec h3{margin:0 0 4px;font-size:17px}.rec p{margin:4px 0;font-size:15px}
.wc{position:relative;width:300px;max-width:100%;margin:12px auto}
.wc canvas{width:100%;display:block;border-radius:50%;transition:transform 4.2s cubic-bezier(.17,.67,.12,1);border:4px solid var(--card);box-shadow:0 2px 12px #0003}
.ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--tx);z-index:2}
#wm{text-align:center;color:var(--mu);min-height:24px;margin:6px 0}
.miss{color:var(--mu);font-size:13px}
.m{font-size:14px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 6px}
.row{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--bd);font-size:15px}
.row.today{background:var(--card);border-radius:8px;font-weight:bold}
.row .d{width:52px;color:var(--mu);flex:none}.row .t{flex:1}
.row.done .t{text-decoration:line-through;opacity:.5}
</style>
</head>
<body>
<main>
<h1>🎬 Ֆիլմ + ☕ սուրճ</h1>
<p class="sub">Ամեն օրվա համար մեկ ֆիլմ՝ Հարի Փոթերից մինչև ամանորյա կախարդանք։</p>

<div class="card" id="today"></div>
<div class="card" style="text-align:center"><b>🎡 Ընտրիր ֆիլմը պտտելով</b>
<div class="wc"><div class="ptr"></div><canvas id="wh" width="300" height="300"></canvas></div>
<button class="pri" id="sp">Պտտել</button><p id="wm">Կընտրվի դեռ չդիտված ֆիլմերից՝ ընտրված օրվա համար</p></div>

<h2>☕ Ի՞նչ ունես տանը</h2>
<div class="chips" id="ings"></div>
<div id="recs"></div>

<h2>📅 Ամբողջ օրացույցը</h2>
<div id="cal"></div>
</main>

լ Սուրբ Ծնունդ (2019)|Սթոունների ընտանիքը (2005)|Պահապանների վերելքը (2012)|Ոգեշնչված (2022)|Սուրբ Ծննդյան տարեգրություն (2018)|Սուրբ Ծննդյան տարեգրություն 2 (2020)|🎄 Հարրի Փոթերը և փիլիսոփայական քարը (2001)|Ֆրեդ Կլաուս (2007)|Ջումանջի (1995)|Միսիս Դաութֆայր (1993)|Ետ դեպի ապագա (1985)|Բրիջիտ Ջոնսի օրագիրը (2001)|🎆 Երբ Հարրին հանդիպեց Սալլիին (1989)`;
const FILMS=RAW.split("|");
const MN=["հունվարի","փետրվարի","մարտի","ապրիլի","մայիսի","հունիսի","հուլիսի","օգոստոսի","սեպտեմբերի","հոկտեմբերի","նոյեմբերի","դեկտեմբերի"];
const dateOf=i=>{const d=new Date(START);d.setDate(d.getDate()+i);return d};
const fmt=d=>d.getDate()+" "+MN[d.getMonth()];
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
let cur=Math.round((day0(new Date())-START)/864e5);
let todayIdx=cur;
if(cur<0)cur=0;if(cur>=FILMS.length)cur=FILMS.length-1;
let swaps=[];try{swaps=JSON.parse(localStorage.getItem("s2")||"[]")}catch(e){}
swaps.forEach(([a,b])=>{[FILMS[a],FILMS[b]]=[FILMS[b],FILMS[a]]});
let watched={};
try{watched=JSON.parse(localStorage.getItem("w")||"{}")}catch(e){}
const fu=()=>{let i=0;while(i<FILMS.length&&watched[i])i++;return i};
const locked=i=>i>fu()||i>todayIdx;
cur=Math.max(0,Math.min(fu(),todayIdx,FILMS.length-1));
const save=()=>{try{localStorage.setItem("w",JSON.stringify(watched))}catch(e){}};

function renderToday(){
  const t=document.getElementById("today");
  t.innerHTML=`<div class="date">${cur===todayIdx?"Այսօր՝ ":""}${fmt(dateOf(cur))}</div>
  <div class="film">${FILMS[cur]}</div>
  <div class="nav"><button id="p">← Նախորդը</button><button id="n"${cur>=FILMS.length-1||locked(cur+1)?" disabled style=\"opacity:.4\"":""}>${cur<FILMS.length-1&&locked(cur+1)?"🔒 Հաջորդը":"Հաջորդը →"}</button>
  <button class="pri" id="w">${watched[cur]?"✓ Դիտեցի":"Նշել՝ դիտեցի"}</button></div>`;
  p.onclick=()=>{if(cur>0){cur--;all()}};
  n.onclick=()=>{if(cur<FILMS.length-1&&!locked(cur+1)){cur++;all()}};
  w.onclick=()=>{watched[cur]=!watched[cur];save();all()};
}
function renderCal(){
  let h="",lm=-1;
  FILMS.forEach((f,i)=>{
    const d=dateOf(i);
    if(d.getMonth()!==lm){lm=d.getMonth();h+=`<div class="m">${MN[lm]}</div>`}
    const L=locked(i);
    h+=`<div class="row${i===cur?" today":""}${watched[i]?" done":""}" data-i="${i}" style="cursor:${L?"default":"pointer"}${L?";opacity:.55":""}"><span class="d">${d.getDate()} ${MN[lm].slice(0,3)}.</span><span class="t">${L?"🔒 Կբացվի "+fmt(d)+"-ին, նախորդը դիտելուց հետո":f}</span><span>${watched[i]?"✓":""}</span></div>`;
  });
  const c=document.getElementById("cal");c.innerHTML=h;
  c.querySelectorAll(".row").forEach(r=>r.onclick=()=>{if(locked(+r.dataset.i))return;cur=+r.dataset.i;all();scrollTo({top:0,behavior:"smooth"})});
}

const have=new Set(["3in1"]);
function renderIngs(){
  const c=document.getElementById("ings");c.innerHTML="";
  for(const k in ING){const b=document.createElement("button");b.className="chip"+(have.has(k)?" on":"");b.textContent=ING[k];
    b.onclick=()=>{have.has(k)?have.delete(k):have.add(k);renderIngs()};c.appendChild(b)}
  const ok=[],near=[];
  R.forEach(r=>{const ms=r.i.filter(x=>!have.has(x));if(!ms.length)ok.push(r);else if(ms.length===1)near.push([r,ms[0]])});
  let h="";
  const card=(r,mis)=>{
    const opt=r.o.filter(x=>have.has(x)).map(x=>ING[x]).join(", ");
    return `<div class="card rec"><h3>${r.n}</h3><p>${r.t}</p><p class="miss">Տրամադրություն՝ ${r.m}${opt?" · Կարող ես ավելացնել՝ "+opt:""}${mis?" · Պակասում է՝ "+ING[mis]:""}</p></div>`};
  h+=ok.length?ok.map(r=>card(r)).join(""):`<div class="card">Նշիր սուրճի տեսակը 👆</div>`;
  if(near.length)h+=`<div class="m">Գրեթե կարող ես (պակասում է 1 բան)</div>`+near.map(x=>card(x[0],x[1])).join("");
  document.getElementById("recs").innerHTML=h;
}
let rot=0,spinning=false;
function drawWheel(c){const x=wh.getContext("2d"),n=c.length,r=150,cols=["#b4562a","#7a3b1d","#d98a4a","#5b3a29","#c4663a","#8a4a2a","#e0a060","#6b4430"];
x.clearRect(0,0,300,300);
c.forEach((idx,k)=>{const a0=-Math.PI/2+k*2*Math.PI/n,a1=a0+2*Math.PI/n;
x.beginPath();x.moveTo(r,r);x.arc(r,r,r-2,a0,a1);x.fillStyle=cols[k%8];x.fill();
x.save();x.translate(r,r);x.rotate((a0+a1)/2);x.fillStyle="#fff";x.font="12px sans-serif";x.textAlign="right";
let t=FILMS[idx].replace(/ \(\d+\)$/,"");if(t.length>20)t=t.slice(0,19)+"…";x.fillText(t,r-14,4);x.restore()})}
sp.onclick=()=>{
  if(spinning)return;
  if(cur<7){wm.textContent="Հարրի Փոթերի մասերը գնում են հերթականությամբ 🧙";return}
  if(FILMS[cur].includes("⭐")){wm.textContent="«Չորեքշաբթի»-ի օրերը ֆիքսված են ⭐";return}
  const pool=FILMS.map((f,i)=>i).filter(i=>i>=7&&!watched[i]&&i!==cur&&!FILMS[i].includes("⭐")).sort(()=>Math.random()-.5);
  if(pool.length<2){wm.textContent="Չդիտված ֆիլմեր չմնացին 🙂";return}
  const c=pool.slice(0,8),n=c.length,k=Math.floor(Math.random()*n);
  drawWheel(c);spinning=true;wm.textContent="Պտտվում է…";
  const target=360-(k+.5)*360/n;
  rot+=360*5+(((target-rot)%360)+360)%360;
  wh.style.transform="rotate("+rot+"deg)";
  setTimeout(()=>{const a=cur,b=c[k];[FILMS[a],FILMS[b]]=[FILMS[b],FILMS[a]];swaps.push([a,b]);
    try{localStorage.setItem("s2",JSON.stringify(swaps))}catch(e){}
    spinning=false;all();wm.textContent="🎉 Ընտրվեց՝ "+FILMS[a]},4400);
};

all();renderIngs();drawWheel(FILMS.map((f,i)=>i).filter(i=>!FILMS[i].includes("⭐")).slice(cur,cur+8));
